<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Email List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
    <h1>Join our email list </h1>
    <p>Enter your email and name to join the list.</p>

    <form method="post" action="/login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required><br>

        <label for="fname">First Name</label>
        <input id="fname" name="fname" maxlength="50" autocomplete="given-name" required><br>

        <label for="lname">Last Name</label>
        <input id="lname" name="lname" maxlength="50" autocomplete="family-name" required><br>

        <button type="submit">Join</button>
    </form>
</main>
</body>
</html>
