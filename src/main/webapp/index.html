<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
    <h1>Join our email list </h1>
    <p>bala</p>

    <form method="post" action="/login">
        <label for="username">Email</label>
        <input id="username" name="username" maxlength="50" autocomplete="username" required><br>

        <label for="fname">First Name</label>
        <input id="fname" name="fname" type="fname" maxlength="254" autocomplete="fname" required><br>

        <label for="lname">Last Name</label>
        <input id="lname" name="lname" type="lname" maxlength="lname" autocomplete="lname" required><br>

        <button type="submit">Join</button>
    </form>
</main>
</body>
</html>
